name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code (full history for secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require full commit SHA pins for all actions
        run: |
          bad=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "Unpinned actions found:"
            echo "$bad"
            exit 1
          fi

      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan commits for secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_AFTER_SHA}"
          else
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          fi
          echo "Scanning range: $range"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --log-opts="$range" --redact --verbose

      - name: Install pre-commit and Checkov (pinned versions)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check pre-commit==4.6.2 checkov==3.3.10
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Terraform and TFLint (pinned, checksum-verified)
        env:
          TERRAFORM_VERSION: 1.16.6
          TERRAFORM_SHA256: 38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7
          TFLINT_VERSION: 0.64.0
          TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/tf-bin"
          mkdir -p "$BIN"

          curl -sSfL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$BIN"

          curl -sSfL -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/tflint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tflint.zip" tflint -d "$BIN"

          echo "$BIN" >> "$GITHUB_PATH"

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
